name: Build & Deploy to Release-Ready

on:
  pull_request:
    branches:
      - release
    types: [opened, synchronize, reopened]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    if: github.head_ref == 'develop'
    permissions:
      contents: write

    steps:
      - name: Checkout develop branch
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Remove node_modules and specific hidden files
        run: |
          rm -rf node_modules
          rm -rf .claude
          rm -f .babelrc \
                .distignore \
                .eslintignore \
                .eslintrc.js \
                .prettierignore \
                .prettierrc.js \
                .stylelintignore \
                .stylelintrc \
                .gitignore
          echo "Remaining root entries:"
          ls -la

      - name: Commit and push to release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Build: develop -> release [$(date +'%Y-%m-%d %H:%M:%S')]"
          fi
          git push origin HEAD:release --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}